name: Smart Timing Quant Scan

on:
  workflow_dispatch:
  schedule:
    # 纽约时间 9:35 AM (周一到周五) -> UTC 13:35
    - cron: '35 13 * * 1-5'
    # 纽约时间 4:05 PM (周一到周五) -> UTC 20:05
    - cron: '05 20 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: field-6.0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install yfinance finvizfinance pandas numpy tabulate pytz

    - name: Run Engine
      run: python main.py

    - name: Push Report and Database
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. 把新生成的报告暂时藏起来 (Stash)
        git add .
        git stash
        
        # 2. 拉取远端最新的代码 (比如你刚刚在网页上改的注释)
        git pull origin field-6.0 --rebase
        
        # 3. 把报告拿回来 (Unstash)
        git stash pop || echo "No changes to pop"
        
        # 4. 再次添加并提交
        git add report_smart.md
        git add history_database/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update 6.1 [skip ci]" && git push origin field-6.0)
