name: Global Market Quant Scan

on:
  workflow_dispatch:
  push:
    branches:
      - global-scan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 关键权限

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: global-scan # 强制指定检出当前分支

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance finvizfinance pandas numpy pandas_market_calendars pytz tabulate

    - name: Run Quant Engine
      run: python main.py

    - name: Push Report to Global Branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add report.md
        # 只有在文件有变动时才提交，避免报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Global Scan Report [skip ci]" && git push origin global-scan)
